<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La cave — day2day</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #f7f7f7;
  --surface2: #ececec;
  --border: #e0e0e0;
  --text: #1a1a1a;
  --muted: #777;
  --accent: #38A5AB;
  --accent-dim: rgba(56, 165, 171, 0.10);
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

/* ── Header ── */
header { padding: 20px 32px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; margin-right: auto; }
header h1 span { color: var(--accent); }
#total-count { color: var(--muted); font-size: 0.85rem; }

/* ── Controls ── */
#controls {
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 10;
}
#search {
  flex: 1 1 220px;
  padding: 9px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.95rem;
}
#search:focus { outline: none; border-color: var(--accent); }
select {
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 0.85rem;
  cursor: pointer;
}
select:focus { outline: none; border-color: var(--accent); }
#btn-reset {
  padding: 8px 14px;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--muted);
  font-size: 0.85rem;
  cursor: pointer;
  white-space: nowrap;
}
#btn-reset:hover { border-color: var(--accent); color: var(--accent); }

/* ── Results bar ── */
#results-bar {
  padding: 10px 32px;
  font-size: 0.85rem;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}

/* ── Grid ── */
#cave {
  padding: 20px 32px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
}
.card {
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  display: flex;
  flex-direction: column;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
.photo-wrap {
  position: relative;
  padding-top: 120%;
  background: var(--surface2);
  overflow: hidden;
}
.photo-wrap img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.no-photo {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem; color: var(--muted);
}
.couleur-bande { height: 4px; width: 100%; }
.card-body { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; }
.card-region { font-size: 0.72rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-titre { font-size: 0.88rem; margin-top: 3px; line-height: 1.3; font-weight: 500; }
.card-cuvee { font-size: 0.78rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 0.75rem; color: var(--muted); margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; }
.stars { display: inline-flex; }
.stock { font-size: 0.72rem; }

/* Étoiles de notation (demi-points par superposition, rendu fiable cross-police) */
.etoiles { display: inline-flex; line-height: 1; }
.etoiles .etoile { position: relative; color: var(--surface2); }
.etoiles .etoile .pleine { position: absolute; top: 0; left: 0; overflow: hidden; color: var(--accent); white-space: nowrap; }

/* ── Empty / loading ── */
#empty, #loading {
  display: none;
  text-align: center;
  padding: 80px 32px;
  color: var(--muted);
}
#empty .icon { font-size: 3rem; margin-bottom: 12px; }

/* ── Modal ── */
#modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
#modal-overlay.open { display: flex; }
#modal {
  background: var(--surface);
  border-radius: 12px;
  width: 100%;
  max-width: 680px;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  gap: 0;
  position: relative;
}
#modal-photo-col {
  width: 240px;
  flex-shrink: 0;
  background: var(--surface2);
  border-radius: 12px 0 0 12px;
  overflow: hidden;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
#modal-photo-col img { width: 100%; display: block; }
#modal-photo-placeholder {
  width: 100%;
  aspect-ratio: 3/4;
  display: flex; align-items: center; justify-content: center;
  font-size: 5rem; color: var(--muted);
}
#modal-body {
  padding: 28px 28px 28px 24px;
  flex: 1;
  min-width: 0;
}
#modal-region {
  color: var(--accent);
  font-weight: 600;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
#modal-body h2 { font-size: 1.2rem; line-height: 1.3; margin-bottom: 2px; }
#modal-cuvee { color: var(--muted); font-size: 0.95rem; margin-bottom: 18px; }
.modal-table { width: 100%; border-collapse: collapse; }
.modal-table td { padding: 7px 0; font-size: 0.88rem; vertical-align: top; }
.modal-table td:first-child { color: var(--muted); width: 120px; padding-right: 12px; }
.modal-table tr { border-bottom: 1px solid var(--border); }
.modal-table tr:last-child { border-bottom: none; }
.modal-stars { color: var(--accent); font-size: 1.05rem; }
#modal-commentaire { margin-top: 18px; font-size: 0.9rem; line-height: 1.5; font-style: italic; color: var(--text); }
#modal-close {
  position: absolute;
  top: 14px; right: 16px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.4rem;
  cursor: pointer;
  line-height: 1;
  padding: 4px 8px;
  border-radius: 4px;
}
#modal-close:hover { color: var(--text); background: var(--surface2); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

@media (max-width: 600px) {
  header { padding: 16px; }
  #controls { padding: 12px 16px; }
  #cave { padding: 16px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  #results-bar { padding: 8px 16px; }
  #modal { flex-direction: column; max-width: 100%; }
  #modal-photo-col { width: 100%; border-radius: 12px 12px 0 0; max-height: 260px; }
}
</style>
</head>
<body>

<header>
  <h1>La <span>cave</span></h1>
  <span id="total-count"></span>
</header>

<div id="controls">
  <input type="search" id="search" placeholder="Rechercher domaine, cuvée, région…">
  <select id="filter-couleur"><option value="">Toutes les couleurs</option></select>
  <select id="filter-region"><option value="">Toutes les régions</option></select>
  <select id="sort">
    <option value="apogee">Tri : apogée (à boire bientôt)</option>
    <option value="note">Tri : note d'Élise</option>
    <option value="recent">Tri : ajout récent</option>
  </select>
  <button id="btn-reset">Réinitialiser</button>
</div>

<div id="results-bar"><span id="count"></span></div>

<div id="loading">Chargement de la cave…</div>
<div id="cave"></div>
<div id="empty"><div class="icon">🍷</div><div>Aucun vin ne correspond à ces critères.</div></div>

<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close" aria-label="Fermer">✕</button>
    <div id="modal-photo-col">
      <img id="modal-photo-img" src="" alt="" style="display:none">
      <div id="modal-photo-placeholder">🍷</div>
    </div>
    <div id="modal-body">
      <div id="modal-region"></div>
      <h2 id="modal-titre"></h2>
      <div id="modal-cuvee"></div>
      <table class="modal-table" id="modal-table"></table>
      <div id="modal-commentaire"></div>
    </div>
  </div>
</div>

<script>
'use strict';

const COULEURS = {
  rouge: '#7b1e2b', blanc: '#d9c873', 'rosé': '#e8a0a8',
  effervescent: '#c9b458', autre: '#999999',
};

let tousLesVins = [];

// ── Chargement ─────────────────────────────────────────────────────────────
async function charger() {
  document.getElementById('loading').style.display = 'block';
  try {
    const r = await fetch('vins.json', { cache: 'no-store' });
    const data = await r.json();
    tousLesVins = Array.isArray(data.vins) ? data.vins : [];
  } catch (e) {
    tousLesVins = [];
  }
  document.getElementById('loading').style.display = 'none';
  remplirFiltres();
  rendre();
}

// ── Filtres dynamiques (couleur + région) ──────────────────────────────────
function remplirFiltres() {
  const couleurs = [...new Set(tousLesVins.map((v) => v.couleur).filter(Boolean))].sort();
  const regions = [...new Set(tousLesVins.map((v) => v.region).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
  const selC = document.getElementById('filter-couleur');
  const selR = document.getElementById('filter-region');
  selC.innerHTML = '<option value="">Toutes les couleurs</option>' + couleurs.map((c) => `<option value="${c}">${c}</option>`).join('');
  selR.innerHTML = '<option value="">Toutes les régions</option>' + regions.map((r) => `<option value="${r}">${r}</option>`).join('');
  document.getElementById('total-count').textContent =
    tousLesVins.length + ' vin' + (tousLesVins.length > 1 ? 's' : '');
}

// ── Tri par apogée : extrait la première année trouvée ──────────────────────
// Une valeur sans année (« à boire ») est traitée comme « maintenant » → remonte.
function anneeApogee(v) {
  const s = v.apogee || '';
  const m = /(\d{4})/.exec(s);
  if (m) return Number(m[1]);
  return new Date().getFullYear(); // pas d'année → à boire maintenant
}

// ── Rendu de la liste ───────────────────────────────────────────────────────
function rendre() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const fc = document.getElementById('filter-couleur').value;
  const fr = document.getElementById('filter-region').value;
  const tri = document.getElementById('sort').value;

  let vins = tousLesVins.filter((v) => {
    if (fc && v.couleur !== fc) return false;
    if (fr && v.region !== fr) return false;
    if (q) {
      const hay = [v.domaine, v.cuvee, v.region, v.appellation].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  vins.sort((a, b) => {
    if (tri === 'note') return (b.note_elise ?? -1) - (a.note_elise ?? -1);
    if (tri === 'recent') return String(b.date_ajout || '').localeCompare(String(a.date_ajout || ''));
    return anneeApogee(a) - anneeApogee(b); // apogée : à boire bientôt d'abord
  });

  const conteneur = document.getElementById('cave');
  const vide = document.getElementById('empty');
  conteneur.innerHTML = '';
  document.getElementById('count').textContent =
    vins.length + ' vin' + (vins.length > 1 ? 's' : '') + ' affiché' + (vins.length > 1 ? 's' : '');

  if (vins.length === 0) {
    vide.style.display = 'block';
    return;
  }
  vide.style.display = 'none';

  for (const v of vins) {
    conteneur.appendChild(carte(v));
  }
}

// Étoiles /5 demi-points : 5 étoiles vides « ★★★★★ » avec une couche pleine
// rognée en largeur à (note/5) — demi-étoile rendue de façon fiable, sans glyphe spécial.
function etoilesHTML(note) {
  if (note == null) return '';
  const pct = Math.max(0, Math.min(100, (note / 5) * 100));
  return `<span class="etoiles"><span class="etoile">★★★★★<span class="pleine" style="width:${pct}%">★★★★★</span></span></span>`;
}

function carte(v) {
  const card = document.createElement('div');
  card.className = 'card';

  const bande = document.createElement('div');
  bande.className = 'couleur-bande';
  bande.style.background = COULEURS[v.couleur] || COULEURS.autre;

  const wrap = document.createElement('div');
  wrap.className = 'photo-wrap';
  if (v.photos && v.photos[0]) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = v.photos[0];
    img.alt = v.domaine || '';
    wrap.appendChild(img);
  } else {
    const np = document.createElement('div');
    np.className = 'no-photo';
    np.textContent = '🍷';
    wrap.appendChild(np);
  }

  const body = document.createElement('div');
  body.className = 'card-body';
  const region = document.createElement('div');
  region.className = 'card-region';
  region.textContent = v.region || '';
  const titre = document.createElement('div');
  titre.className = 'card-titre';
  titre.textContent = v.domaine || '';
  const cuvee = document.createElement('div');
  cuvee.className = 'card-cuvee';
  cuvee.textContent = [v.cuvee, v.millesime].filter(Boolean).join(' · ');
  const meta = document.createElement('div');
  meta.className = 'card-meta';
  const stars = document.createElement('span');
  stars.className = 'stars';
  stars.innerHTML = etoilesHTML(v.note_elise);
  const stock = document.createElement('span');
  stock.className = 'stock';
  stock.textContent = (v.bouteilles != null) ? v.bouteilles + ' bt' : '';
  meta.appendChild(stars);
  meta.appendChild(stock);

  body.appendChild(region);
  body.appendChild(titre);
  body.appendChild(cuvee);
  body.appendChild(meta);

  card.appendChild(bande);
  card.appendChild(wrap);
  card.appendChild(body);
  card.addEventListener('click', () => ouvrirModal(v));
  return card;
}

// ── Modal détail ────────────────────────────────────────────────────────────
function ouvrirModal(v) {
  document.getElementById('modal-region').textContent = v.region || '';
  document.getElementById('modal-titre').textContent = v.domaine || '';
  document.getElementById('modal-cuvee').textContent = [v.cuvee, v.millesime].filter(Boolean).join(' · ');

  const img = document.getElementById('modal-photo-img');
  const ph = document.getElementById('modal-photo-placeholder');
  if (v.photos && v.photos[0]) {
    img.src = v.photos[0];
    img.style.display = 'block';
    ph.style.display = 'none';
  } else {
    img.style.display = 'none';
    ph.style.display = 'flex';
  }

  const lignes = [
    ['Couleur', v.couleur],
    ['Appellation', v.appellation],
    ['Classement', v.classement],
    ['Cépages', Array.isArray(v.cepages) && v.cepages.length ? v.cepages.join(', ') : null],
    ['Apogée', v.apogee],
    ['Date limite', v.date_limite],
    ['Accords', v.accords],
    ['Note d\'Élise', v.note_elise != null ? `<span class="modal-stars">${etoilesHTML(v.note_elise)}</span> ${v.note_elise}/5` : null],
    ['Note Parker', v.note_parker != null ? v.note_parker + '/100' : null],
    ['Note Hachette', v.note_hachette != null ? '★'.repeat(v.note_hachette) || '—' : null],
    ['Bouteilles', v.bouteilles != null ? String(v.bouteilles) : null],
  ];
  const tbody = document.getElementById('modal-table');
  tbody.innerHTML = lignes
    .filter(([, val]) => val != null && val !== '')
    .map(([k, val]) => `<tr><td>${k}</td><td>${val}</td></tr>`)
    .join('');

  document.getElementById('modal-commentaire').textContent = v.commentaire_elise || '';

  document.getElementById('modal-overlay').classList.add('open');
}

function fermerModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

// ── Événements ──────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', rendre);
document.getElementById('filter-couleur').addEventListener('change', rendre);
document.getElementById('filter-region').addEventListener('change', rendre);
document.getElementById('sort').addEventListener('change', rendre);
document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('search').value = '';
  document.getElementById('filter-couleur').value = '';
  document.getElementById('filter-region').value = '';
  document.getElementById('sort').value = 'apogee';
  rendre();
});
document.getElementById('modal-close').addEventListener('click', fermerModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') fermerModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fermerModal(); });

charger();
</script>
</body>
</html>
